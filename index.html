      {ref:"Romains 5.8-9",lsg21:"« Mais Dieu prouve son amour envers nous en ce que, lorsque nous étions encore des pécheurs, Christ est mort pour nous. À plus forte raison donc, maintenant que nous sommes justifiés par son sang, serons-nous sauvés par lui de la colère. »",semeur:"« Mais Dieu nous a donné la preuve de son amour : le Christ est mort pour nous alors que nous étions encore pécheurs. Maintenant que nous avons été déclarés justes grâce à son sacrifice, nous serons, à plus forte raison, sauvés par lui de la colère de Dieu. »"},
      {ref:"2 Corinthiens 5.21",lsg21:"« Celui qui n'a pas connu le péché, il l'a fait devenir péché pour nous, afin que nous devenions en lui justice de Dieu. »",semeur:"« Celui qui n'a pas connu le péché, Dieu l'a fait devenir péché pour nous, afin que, dans l'union avec le Christ, nous devenions justice de Dieu. »"},
      {ref:"Romains 3.24-25",lsg21:"« Ils sont justifiés gratuitement par sa grâce, par la rédemption qui est en Jésus-Christ. C'est lui que Dieu a destiné à être, par son sang, une propitiation au moyen de la foi. »",semeur:"« Et ils sont déclarés justes par sa grâce ; c'est un don que Dieu leur fait par le moyen de la délivrance apportée par Jésus-Christ. C'est lui que Dieu a offert comme une victime destinée à expier les péchés, pour ceux qui croient en son sacrifice. »"}
    ]},
    {title:"4. La Sanctification", intro:"Par son sang, Jésus a séparé notre corps du péché pour en faire le temple du Saint-Esprit. Conséquence pratique : le diable n'a plus aucun droit légal de séjour ni de pouvoir sur nous.", verses:[
      {ref:"Hébreux 13.12",lsg21:"« C'est pourquoi Jésus aussi, pour sanctifier le peuple par son propre sang, a souffert hors de la porte. »",semeur:"« C'est pourquoi Jésus aussi, pour purifier le peuple par son propre sang, a souffert hors de la porte de la ville. »"},
      {ref:"1 Corinthiens 6.19-20",lsg21:"« Ne savez-vous pas que votre corps est le temple du Saint-Esprit qui est en vous, que vous avez reçu de Dieu, et que vous ne vous appartenez pas à vous-mêmes ? Car vous avez été achetés à un grand prix. Glorifiez donc Dieu dans votre corps. »",semeur:"« Ou bien ignorez-vous que votre corps est le temple même du Saint-Esprit qui vous a été donné par Dieu et qui, maintenant, demeure en vous ? Vous ne vous appartenez donc pas à vous-mêmes. Car vous avez été rachetés à grand prix. Honorez donc Dieu dans votre corps. »"},
      {ref:"Colossiens 1.13-14",lsg21:"« Il nous a délivrés de la puissance des ténèbres et nous a transportés dans le royaume du Fils de son amour, en qui nous avons la rédemption, le pardon des péchés. »",semeur:"« Il nous a arrachés au pouvoir des ténèbres et nous a fait passer dans le royaume de son Fils bien-aimé. Et c'est par lui que nous avons été délivrés et que nous avons reçu le pardon des péchés. »"}
    ]},
    {title:"5. La Vie", intro:"Dans le plan de Dieu, la vie de la chair est dans le sang. Recevoir le sang de Jésus par la foi, c'est recevoir la vie même de Dieu, divine et éternelle, qui nous dynamise spirituellement et physiquement.", verses:[
      {ref:"Lévitique 17.11",lsg21:"« Car la vie de la chair est dans le sang. Je vous l'ai donné pour faire l'expiation sur l'autel pour vos âmes ; car c'est le sang qui fait l'expiation pour l'âme. »",semeur:"« Car la vie d'une créature est dans le sang. Je vous ai donné le sang afin que, sur l'autel, il serve d'expiation pour votre vie. En effet, c'est le sang qui fait l'expiation parce qu'il est la vie. »"},
      {ref:"Jean 6.54-56",lsg21:"« Celui qui mange ma chair et qui boit mon sang a la vie éternelle, et je le ressusciterai au dernier jour. Car ma chair est vraiment une nourriture, et mon sang est vraiment un breuvage. Celui qui mange ma chair et qui boit mon sang demeure en moi et moi en lui. »",semeur:"« Celui qui mange ma chair et qui boit mon sang a la vie éternelle, et moi, je le ressusciterai au dernier jour. Car ma chair est une vraie nourriture et mon sang un vrai breuvage. Celui qui mange ma chair et boit mon sang demeure en moi, et moi je demeure en lui. »"},
      {ref:"1 Corinthiens 11.25-26",lsg21:"« De même, il prit aussi la coupe après le repas, en disant : « Cette coupe est la nouvelle alliance en mon sang ; faites ceci en mémoire de moi, toutes les fois que vous en boirez. » Car toutes les fois que vous mangez ce pain et que vous buvez cette coupe, vous annoncez la mort du Seigneur jusqu'à ce qu'il vienne. »",semeur:"« De même, après le repas, il prit la coupe et dit : « Cette coupe est la nouvelle alliance scellée de mon sang. Toutes les fois que vous en boirez, faites-le en mémoire de moi. » En effet, toutes les fois que vous mangez ce pain et que vous buvez cette coupe, vous annoncez la mort du Seigneur, et ceci jusqu'à ce qu'il vienne. »"}
    ]},
    {title:"6. L'Intercession", intro:"Contrairement au sang d'Abel qui criait vengeance, le sang de Jésus crie miséricorde en permanence devant le Père. Même quand nous sommes faibles ou incapables de prier, son sang plaide efficacement en notre faveur.", verses:[
      {ref:"Hébreux 12.24",lsg21:"« À Jésus, médiateur d'une nouvelle alliance, et au sang de l'aspersion qui parle mieux que celui d'Abel. »",semeur:"« De Jésus, le médiateur d'une alliance nouvelle, et du sang purificateur qui parle mieux que celui d'Abel. »"},
      {ref:"Genèse 4.10",lsg21:"« Et Dieu dit : Qu'as-tu fait ? La voix du sang de ton frère crie de la terre jusqu'à moi. »",semeur:"« Dieu lui dit : « Qu'as-tu fait ? J'entends le sang de ton frère crier du sol jusqu'à moi. » »"},
      {ref:"Hébreux 7.25",lsg21:"« C'est pourquoi aussi il peut sauver parfaitement ceux qui s'approchent de Dieu par lui, étant toujours vivant pour intercéder en leur faveur. »",semeur:"« C'est pour cela aussi qu'il est en mesure de sauver parfaitement ceux qui s'approchent de Dieu par lui, puisqu'il est toujours vivant pour intercéder en leur faveur. »"}
    ]},
    {title:"7. L'Accès confiant", intro:"Le voile du temple a été déchiré par ce sang, ouvrant un chemin direct et vivant vers le Trône de Dieu. Nous pouvons désormais entrer hardiment dans la présence du Père, sans crainte ni condamnation.", verses:[
      {ref:"Hébreux 10.19-22",lsg21:"« Ainsi donc, frères, puisque nous avons, grâce au sang de Jésus, une pleine liberté pour entrer dans le sanctuaire par le chemin nouveau et vivant qu'il a inauguré pour nous au travers du voile, c'est-à-dire de sa chair, et puisque nous avons un grand prêtre établi sur la maison de Dieu, approchons-nous avec un cœur sincère, dans la pleine assurance de la foi. »",semeur:"« Ainsi, frères et sœurs, nous avons une pleine liberté pour entrer dans le lieu très saint, grâce au sang du sacrifice de Jésus. Il nous a ouvert un chemin nouveau et vivant à travers le rideau du sanctuaire, c'est-à-dire à travers son propre corps. Nous avons un grand-prêtre éminent placé à la tête de la maison de Dieu. Approchons-nous donc de Dieu avec un cœur sincère, une foi pleine et entière. »"},
      {ref:"Éphésiens 2.13",lsg21:"« Mais maintenant, en Jésus-Christ, vous qui étiez autrefois loin, vous avez été rapprochés par le sang du Christ. »",semeur:"« Mais maintenant, par votre union avec Jésus-Christ, vous qui, autrefois, étiez loin de Dieu, vous en êtes devenus proches par le sacrifice du Christ. »"},
      {ref:"Hébreux 4.16",lsg21:"« Approchons-nous donc avec assurance du trône de la grâce, afin d'obtenir miséricorde et de trouver grâce, pour être secourus dans le moment opportun. »",semeur:"« Approchons-nous donc du trône de la grâce avec une pleine assurance, afin d'obtenir compassion et de trouver la grâce nécessaire pour être secourus au bon moment. »"}
    ]}
  ],
  proclamations:[
    "Par le sang de Jésus, j'ai été racheté de la main de Satan. Tous mes péchés sont pardonnés.",
    "Pendant que je marche dans la lumière, le sang de Jésus me purifie, maintenant et continuellement, de tout péché.",
    "Par le sang de Jésus, je suis justifié, acquitté, non coupable, rendu juste — comme si je n'avais jamais péché.",
    "Mon corps est le temple du Saint-Esprit, racheté, purifié, sanctifié par le sang de Jésus. Le diable n'a aucune place en moi et aucun pouvoir sur moi. Mon corps est pour le Seigneur et le Seigneur est pour mon corps.",
    "Seigneur Jésus, quand je reçois Ton sang, je reçois Ta vie — divine, éternelle, sans fin.",
    "Merci, Seigneur, que même quand je ne peux pas prier, Ton sang plaide pour moi dans les cieux.",
    "Par le sang de Jésus aspergé dans les cieux, j'ai accès avec confiance dans la présence de Dieu, dans le Très-Saint."
  ]
},
// ─── ONGLET 6: PROVISION DIVINE ───
{
  id:"provision", short:"Provision divine",
  full:"Dieu pourvoit aux besoins de ses enfants",
  sections:[
    {title:"Le principe fondamental : Dieu est le pourvoyeur", intro:"Le Père n'est ni avare ni distrait ; Il connaît nos besoins avant même que nous ne les formulions. Notre provision ne dépend pas de l'économie du monde, mais de la richesse infinie de Dieu en Christ.", verses:[
      {ref:"Philippiens 4.19",lsg21:"« Et mon Dieu pourvoira à tous vos besoins conformément à sa richesse, avec gloire, en Jésus-Christ. »",semeur:"« Et mon Dieu subviendra pleinement à tous vos besoins ; il le fera selon sa glorieuse richesse qui se manifeste en Jésus-Christ. »"},
      {ref:"Psaume 23.1",lsg21:"« L'Éternel est mon berger : je ne manquerai de rien. »",semeur:"« L'Éternel est mon berger. Je ne manquerai de rien. »"},
      {ref:"Psaume 34.11",lsg21:"« Les lionceaux éprouvent la disette et la faim, mais ceux qui cherchent l'Éternel ne sont privés d'aucun bien. »",semeur:"« Les jeunes lions connaissent la misère et la faim, mais ceux qui cherchent l'Éternel ne seront privés d'aucun bien. »"},
      {ref:"Matthieu 6.31-33",lsg21:"« Ne vous inquiétez donc pas et ne dites pas : « Que mangerons-nous ? Que boirons-nous ? Avec quoi nous habillerons-nous ? » car tout cela, ce sont les membres des autres peuples qui le recherchent. Or, votre Père céleste sait que vous en avez besoin. Recherchez d'abord le royaume et la justice de Dieu, et tout cela vous sera donné en plus. »",semeur:"« Ne vous inquiétez donc pas et ne dites pas : « Que mangerons-nous ? » ou : « Que boirons-nous ? » ou : « Avec quoi nous habillerons-nous ? » Toutes ces choses, les païens s'en préoccupent sans cesse. Mais votre Père, qui est dans les cieux, sait que vous en avez besoin. Faites donc du règne de Dieu et de ce qui est juste à ses yeux votre préoccupation première, et toutes ces choses vous seront données en plus. »"}
    ]},
    {title:"L'abondance promise, non la simple survie", intro:"Le plan de Dieu pour Ses enfants dépasse la simple subsistance ; Il prend plaisir à la prospérité de Son serviteur. Par la grâce de Christ qui s'est fait pauvre pour nous, l'abondance est devenue notre héritage légitime, non un luxe optionnel.", verses:[
      {ref:"2 Corinthiens 9.8",lsg21:"« Et Dieu peut vous combler de toutes ses grâces afin que, possédant toujours à tout égard de quoi satisfaire à tous vos besoins, vous ayez encore en abondance pour toute œuvre bonne. »",semeur:"« Et Dieu est assez puissant pour vous combler de toutes sortes de bienfaits, afin que, possédant toujours en toute chose de quoi satisfaire à tous vos besoins, vous ayez encore en abondance pour toute œuvre bonne. »"},
      {ref:"2 Corinthiens 8.9",lsg21:"« En effet, vous connaissez la grâce de notre Seigneur Jésus-Christ : pour vous il s'est fait pauvre alors qu'il était riche, afin que par sa pauvreté vous soyez enrichis. »",semeur:"« Car vous connaissez la grâce de notre Seigneur Jésus-Christ : lui qui était riche, il s'est fait pauvre pour vous afin que, par sa pauvreté, vous soyez enrichis. »"},
      {ref:"3 Jean 2",lsg21:"« Bien-aimé, je souhaite que tu prospères à tout point de vue et sois en bonne santé, à l'image de ton âme. »",semeur:"« Cher ami, je souhaite que tu prospères à tous égards et que tu sois en aussi bonne santé physique que tu l'es spirituellement. »"},
      {ref:"Psaume 35.27",lsg21:"« Qu'ils aient des cris de joie et d'allégresse, ceux qui prennent plaisir à la justice de leur serviteur, et qu'ils disent sans cesse : « Que l'Éternel soit célébré, lui qui prend plaisir à la prospérité de son serviteur ! » »",semeur:"« Mais que ceux qui prennent plaisir à mon droit reconnu poussent des cris de joie. Et qu'ils disent sans cesse : « L'Éternel est grand, lui qui veut le bonheur de son serviteur ! » »"}
    ]},
    {title:"Les conditions : semence, dîme et générosité", intro:"Le royaume de Dieu fonctionne sur un principe de semence : ce que l'on donne détermine ce que l'on reçoit. Que ce soit nos finances, notre temps ou notre amour, Dieu multiplie ce que nous Lui confions avec foi.", verses:[
      {ref:"Malachie 3.10",lsg21:"« Apportez toutes les dîmes à la maison du trésor, afin qu'il y ait de la nourriture dans ma maison. Mettez-moi ainsi à l'épreuve, dit l'Éternel des armées, et vous verrez si je n'ouvre pas pour vous les écluses du ciel, si je ne déverse pas sur vous la bénédiction en abondance. »",semeur:"« Apportez donc vos dîmes dans leur totalité dans le trésor du Temple pour qu'il y ait des vivres dans mon temple. Mettez-moi à l'épreuve de cette manière-là, dit l'Éternel, le Seigneur des armées célestes, et vous verrez bien si je n'ouvre pas pour vous les écluses des cieux, et si je ne déverse pas sur vous ma bénédiction en abondance. »"},
      {ref:"Luc 6.38",lsg21:"« Donnez et l'on vous donnera : on versera dans le pan de votre vêtement une bonne mesure, bien tassée, secouée et qui déborde, car on utilisera pour vous la même mesure que celle dont vous vous serez servis. »",semeur:"« Donnez, et l'on vous donnera : on versera dans le pan de votre vêtement une bonne mesure bien tassée, secouée et débordante ; car on emploiera, à votre égard, la mesure dont vous vous serez servis pour mesurer. »"},
      {ref:"Proverbes 3.9-10",lsg21:"« Honore l'Éternel avec tes biens et avec les prémices de tout ton revenu : alors tes greniers seront remplis d'abondance et tes cuves regorgeront de vin nouveau. »",semeur:"« Honore l'Éternel en lui donnant une part de tes biens, en lui offrant les prémices de tous tes revenus. Alors tes greniers regorgeront de blé, et tes cuves déborderont de vin nouveau. »"},
      {ref:"2 Corinthiens 9.6-7",lsg21:"« Sachez-le, celui qui sème peu moissonnera peu et celui qui sème abondamment moissonnera abondamment. Que chacun donne comme il l'a décidé dans son cœur, sans regret ni contrainte, car Dieu aime celui qui donne avec joie. »",semeur:"« N'oubliez pas ceci : celui qui sème peu, moissonnera peu ; celui qui sème en abondance, moissonnera en abondance. Que chacun donne comme il l'a résolu en son cœur, sans regret ni contrainte ; car Dieu aime celui qui donne avec joie. »"}
    ]},
    {title:"La puissance de produire la richesse", intro:"Dieu n'enrichit pas seulement par miracle ; Il dépose en nous la force, la sagesse et la créativité nécessaires pour produire la richesse. Quand cette puissance s'allie à la méditation constante de Sa Parole, tout ce que nous entreprenons prospère.", verses:[
      {ref:"Deutéronome 8.18",lsg21:"« Souviens-toi de l'Éternel, ton Dieu, car c'est lui qui te donne de la force pour acquérir des richesses, afin de confirmer, comme il le fait aujourd'hui, son alliance qu'il a jurée à tes ancêtres. »",semeur:"« Souviens-toi de l'Éternel ton Dieu, car c'est lui qui te donne la force de parvenir à la prospérité, pour accomplir l'alliance qu'il a conclue par serment avec tes ancêtres, comme il le fait aujourd'hui. »"},
      {ref:"Proverbes 10.22",lsg21:"« C'est la bénédiction de l'Éternel qui enrichit, et il ne la fait suivre d'aucun chagrin. »",semeur:"« C'est la bénédiction de l'Éternel qui enrichit, et le tourment n'y ajoute rien. »"},
      {ref:"Josué 1.8",lsg21:"« Que ce livre de la loi ne s'éloigne pas de ta bouche. Médite-le jour et nuit pour agir fidèlement selon tout ce qui y est écrit, car c'est alors que tu auras du succès dans tes entreprises, c'est alors que tu réussiras. »",semeur:"« Que ce livre de la Loi soit toujours sur tes lèvres. Médite-le jour et nuit afin de veiller à agir selon tout ce qui y est écrit, car alors tu mèneras à bien tes projets et tu réussiras. »"},
      {ref:"Psaume 1.1-3",lsg21:"« Heureux l'homme qui ne suit pas le conseil des méchants, qui ne s'arrête pas sur la voie des pécheurs et ne s'assied pas en compagnie des moqueurs, mais qui trouve son plaisir dans la loi de l'Éternel et la médite jour et nuit ! Il est comme un arbre planté près d'un courant d'eau, qui donne son fruit en sa saison et dont le feuillage ne se flétrit pas : tout ce qu'il fait lui réussit. »",semeur:"« Heureux l'homme qui ne marche pas selon les conseils des méchants, qui ne va pas se tenir sur le chemin de ceux qui se détournent de Dieu, et qui ne s'assied pas en compagnie des moqueurs, mais qui, au contraire, trouve son plaisir dans la loi de l'Éternel et la médite jour et nuit. Il sera comme un arbre planté près d'un cours d'eau, qui donne ses fruits en sa saison et dont les feuilles ne se flétrissent pas : tout ce qu'il fait réussit. »"}
    ]},
    {title:"La promesse héritée : bénédiction d'Abraham", intro:"Par la foi en Christ, la bénédiction promise à Abraham est juridiquement transférée jusqu'à nous. Cette bénédiction n'est pas une métaphore : elle se traduit en gloire, en richesse et en justice durables dans notre maison.", verses:[
      {ref:"Galates 3.13-14",lsg21:"« Christ nous a rachetés de la malédiction de la loi en devenant malédiction pour nous, puisqu'il est écrit : Tout homme pendu au bois est maudit. C'est ainsi qu'en Jésus-Christ la bénédiction d'Abraham parvient aux non-Juifs et que nous recevons par la foi l'Esprit qui avait été promis. »",semeur:"« Mais le Christ nous a rachetés de la malédiction de la Loi en prenant la malédiction sur lui à notre place. Il est, en effet, écrit : Maudit est quiconque est pendu au bois. Ainsi, en Jésus-Christ, la bénédiction promise à Abraham devait s'étendre à tous les peuples, et nous avons reçu, par la foi, l'Esprit que Dieu avait promis. »"},
      {ref:"Genèse 12.2",lsg21:"« Je ferai de toi une grande nation, je te bénirai, je rendrai ton nom grand et tu seras une source de bénédiction. »",semeur:"« Je ferai de toi une grande nation ; je te bénirai et je rendrai ton nom grand. Tu seras une source de bénédiction. »"},
      {ref:"Psaume 112.1-3",lsg21:"« Louez l'Éternel ! Heureux l'homme qui craint l'Éternel, qui trouve un grand plaisir à ses commandements. Sa descendance sera puissante sur la terre ; la génération des hommes droits sera bénie. Il y a gloire et richesse dans sa maison, et sa justice subsiste à jamais. »",semeur:"« Louez l'Éternel ! Heureux l'homme qui révère l'Éternel et qui prend un grand plaisir à ses commandements. Ses descendants seront puissants sur la terre ; la postérité des hommes droits sera bénie. Il y a gloire et richesse dans sa maison, et sa justice subsiste à jamais. »"},
      {ref:"Deutéronome 28.11-12",lsg21:"« L'Éternel te comblera de biens en multipliant le fruit de ton corps, le fruit de tes troupeaux et le fruit de ton sol dans le pays que l'Éternel a juré à tes ancêtres de te donner. L'Éternel t'ouvrira son bon trésor, le ciel, pour envoyer au moment voulu la pluie sur ton pays et pour bénir tout le travail de tes mains. »",semeur:"« L'Éternel te comblera de biens en rendant féconds tes enfants, les petits de ton bétail et les produits de ton sol, dans le pays qu'il a juré à tes ancêtres de te donner. L'Éternel t'ouvrira son bon trésor, le ciel, pour envoyer en temps voulu la pluie qu'il faut à ton pays et pour bénir tout le travail de tes mains. »"}
    ]}

  proclamations:[

    "Je sème avec joie et je moissonne avec abondance, car Dieu aime celui qui donne avec joie et il me comble de toutes ses grâces.",

    {title:"Sa Parole ne faillit jamais", intro:"Quand Dieu prononce une parole, elle est active et accomplit exactement ce pour quoi Il l'a envoyée. Méditer la Parole, c'est mettre une semence spirituelle que Dieu Lui-même veille à faire pousser.", verses:[
      {ref:"Nombres 23.19",lsg21:"« Dieu n'est pas un homme pour mentir, ni le fils d'un homme pour revenir sur sa décision. Ce qu'il a dit, ne le fera-t-il pas ? Ce qu'il a déclaré, ne l'accomplira-t-il pas ? »",semeur:"« Dieu n'est pas un homme pour mentir, il n'est pas un être humain pour changer d'avis. Ce qu'il a dit, ne le fera-t-il pas ? Ce qu'il a déclaré, ne le réalisera-t-il pas ? »"},
      {ref:"Ésaïe 55.10-11",lsg21:"« Tout comme la pluie et la neige descendent du ciel et n'y retournent pas sans avoir arrosé la terre, sans l'avoir fécondée et fait germer, sans avoir donné de la semence au semeur et du pain à celui qui mange, ma parole, qui sort de ma bouche, ne retournera pas à moi sans effet, sans avoir fait ce que je désire et sans avoir réalisé l'objectif pour lequel je l'ai envoyée. »",semeur:"« La pluie et la neige descendent du ciel, et elles n'y retournent pas sans avoir arrosé la terre, sans l'avoir fécondée et fait germer les graines, sans avoir donné de la semence au semeur et du pain à celui qui mange. Il en est de même de la parole qui sort de ma bouche : elle ne retourne pas vers moi sans avoir produit d'effet, sans avoir réalisé ce que je voulais, sans avoir atteint le but que je lui avais fixé. »"},
      {ref:"Psaume 33.4",lsg21:"« Car la parole de l'Éternel est droite et toute son œuvre s'accomplit avec fidélité. »",semeur:"« Car la parole de l'Éternel est droite et tout ce qu'il fait est sûr. »"},

    {title:"Ses promesses sont toutes accomplies", intro:"Le Seigneur est comme un gardien veillant jalousement sur Sa propre Parole pour l'exécuter. Même quand tout semble contraire dans le naturel, Dieu est à l'œuvre en coulisses pour honorer Sa promesse.", verses:[
      {ref:"Josué 21.45",lsg21:"« De toutes les bonnes paroles que l'Éternel avait dites à la maison d'Israël, aucune ne resta sans effet : toutes s'accomplirent. »",semeur:"« De toutes les bonnes promesses que l'Éternel avait faites au peuple d'Israël, aucune ne demeura sans effet : toutes s'accomplirent. »"},

    {title:"Il ne t'abandonne jamais", intro:"Si nous sommes infidèles, Lui reste fidèle, car Il ne peut se renier Lui-même. Même quand nous trébuchons dans notre marche, Ses promesses à notre égard restent fermes, inébranlables et actives.", verses:[
      {ref:"Hébreux 13.5-6",lsg21:"« Ne vous laissez pas dominer par l'amour de l'argent ; contentez-vous de ce que vous avez, car Dieu lui-même a dit : Je ne te délaisserai pas et je ne t'abandonnerai pas. C'est donc avec assurance que nous pouvons dire : Le Seigneur est mon secours, je n'aurai peur de rien. Que peut me faire un homme ? »",semeur:"« Que votre conduite ne soit pas guidée par l'amour de l'argent, contentez-vous de ce que vous avez, car Dieu lui-même a dit : Je ne te délaisserai pas et je ne t'abandonnerai pas. Aussi pouvons-nous dire avec assurance : Le Seigneur est celui qui vient à mon secours ; je n'aurai peur de rien. Que pourraient me faire les hommes ? »"},

let state = {
  tabIndex: 0,

  mode: 'versets',
  version: 'lsg21',
  theme: 'dark',

};

function progressKey() {
  return TABS_DATA[state.tabIndex].id + '_' + state.mode;
}

function getCurrentIndex() {
  return state.userProgress[progressKey()] || 0;
}

function setCurrentIndex(i) {
  state.userProgress[progressKey()] = i;
}

// Construit la liste plate des cartes en mode versets : [intro de section, verset, verset, ..., intro suivante, ...]
function buildVerseCards(tab) {
  const cards = [];
  tab.sections.forEach(section => {
    if (section.intro) {
      cards.push({ type: 'intro', sectionTitle: section.title, intro: section.intro });
    }
    section.verses.forEach(v => {
      cards.push({ type: 'verse', sectionTitle: section.title, ref: v.ref, lsg21: v.lsg21, semeur: v.semeur });
    });
  });
  return cards;
}

function saveState() {
  localStorage.setItem('fondements_state', JSON.stringify(state));
  // Stockage redondant sous la clé attendue par la correction
  localStorage.setItem('appProgress', JSON.stringify(state.userProgress));
}

function loadState() {
  const saved = localStorage.getItem('fondements_state');
  if(saved) {
    try { state = { ...state, ...JSON.parse(saved) }; } catch(e){}
  }
  const progress = localStorage.getItem('appProgress');
  if(progress) {
    try { state.userProgress = JSON.parse(progress) || {}; } catch(e){}
  }
  if (!state.userProgress) state.userProgress = {};
  // Nettoyage des champs hérités de l'ancienne version
  delete state.sectionIndex;
  delete state.verseIndex;
  delete state.proclIndex;
  applyTheme();
  applyFontSize();
}

function applyTheme() {
  document.documentElement.setAttribute('data-theme', state.theme === 'light' ? 'light' : '');
  document.getElementById('themeBtn').textContent = state.theme === 'dark' ? '🌙' : '☀️';
}

function applyFontSize() {
  document.documentElement.style.setProperty('--verse-font-size', state.fontSize + 'px');
}

// GESTION DU MENU LATÉRAL
const sidebar = document.getElementById('sidebar');
const menuOverlay = document.getElementById('menuOverlay');

document.getElementById('menuBtn').addEventListener('click', () => {
  sidebar.classList.add('open');
  menuOverlay.classList.add('open');
});
const closeSidebar = () => {
  sidebar.classList.remove('open');
  menuOverlay.classList.remove('open');
};
document.getElementById('closeMenuBtn').addEventListener('click', closeSidebar);
menuOverlay.addEventListener('click', closeSidebar);

// GÉNÉRER LES PILIERS DANS LA SIDEBAR
function renderSidebarTabs() {
  const container = document.getElementById('sidebarTabsContainer');
  if(!container || !TABS_DATA || TABS_DATA.length === 0) return;
  container.innerHTML = '';
  
  TABS_DATA.forEach((tab, index) => {
    const btn = document.createElement('button');
    btn.className = `sidebar-tab-btn ${index === state.tabIndex ? 'active' : ''}`;
    btn.textContent = tab.short;
    btn.onclick = () => {
      state.tabIndex = index;
      saveState();
      render();
      closeSidebar(); // Ferme le menu après le clic
    };
    container.appendChild(btn);
  });
}

// MOTEUR D'AFFICHAGE PRINCIPAL
function render() {
  renderSidebarTabs();

  const mainContent = document.getElementById('mainContent');
  if(!TABS_DATA || TABS_DATA.length === 0) {
    mainContent.innerHTML = "<p style='text-align:center; margin-top:50px; color:#a0a0a0;'>Erreur de chargement des données.</p>";
    return;
  }

  const currentTab = TABS_DATA[state.tabIndex];
  const key = progressKey();

  if(state.mode === 'versets') {
    const cards = buildVerseCards(currentTab);
    let idx = state.userProgress[key] || 0;
    if (idx >= cards.length) idx = 0;
    state.userProgress[key] = idx;

    const card = cards[idx];
    const total = cards.length;
    const percent = Math.round(((idx + 1) / total) * 100);

    let cardHTML;
    if (card.type === 'intro') {
      cardHTML = `
        <div class="intro-card">
          <div class="intro-title">${card.sectionTitle}</div>
          <div class="intro-text">${card.intro}</div>
        </div>
      `;
    } else {
      const textContent = state.version === 'lsg21' ? card.lsg21 : card.semeur;
      cardHTML = `
        <div class="verse-card">
          <div class="verse-ref">${card.ref}</div>
          <div class="verse-text">${textContent}</div>
          <div class="version-badge">${state.version.toUpperCase()}</div>
        </div>
      `;
    }

    mainContent.innerHTML = `
      <div class="theme-title">${currentTab.full}</div>
      <div class="section-label">${card.sectionTitle}</div>
      <div class="progress-info">
        <div class="progress-bar-bg"><div class="progress-bar-fill" style="width: ${percent}%"></div></div>
        <div class="progress-text">${idx + 1}/${total} (${percent}%)</div>
      </div>
      ${cardHTML}
    `;
  } else {
    // Mode Proclamations (pas d'intros)
    const proclamations = currentTab.proclamations;
    let idx = state.userProgress[key] || 0;
    if (idx >= proclamations.length) idx = 0;
    state.userProgress[key] = idx;

    const currentProcl = proclamations[idx];
    const totalProcl = proclamations.length;
    const percent = Math.round(((idx + 1) / totalProcl) * 100);

    mainContent.innerHTML = `
      <div class="theme-title">${currentTab.full}</div>
      <div class="section-label">Déclaration de Foi</div>
      <div class="progress-info">
        <div class="progress-bar-bg"><div class="progress-bar-fill" style="width: ${percent}%"></div></div>
        <div class="progress-text">${idx + 1}/${totalProcl} (${percent}%)</div>
      </div>
      <div class="proclamation-card">
        <div class="proclamation-number">Déclaration ${idx + 1}</div>
        <div class="proclamation-text">${currentProcl}</div>
      </div>
    `;
  }

  // Update Toggles UI
  document.querySelectorAll('#modeToggle .toggle-btn').forEach(btn => {
    btn.classList.toggle('active', btn.getAttribute('data-mode') === state.mode);
  });
  document.querySelectorAll('#versionToggle .toggle-btn').forEach(btn => {
    btn.classList.toggle('active', btn.getAttribute('data-version') === state.version);
  });

  // Le texte recommence en haut quand la police est grande
  window.scrollTo(0, 0);
}

// LOGIQUE NAVIGATION
function getTotalCards() {
  const currentTab = TABS_DATA[state.tabIndex];
  return state.mode === 'versets'
    ? buildVerseCards(currentTab).length
    : currentTab.proclamations.length;
}

function markAsRead() {
  if(!TABS_DATA || TABS_DATA.length === 0) return;
  state.history.push({ tab: state.tabIndex, type: state.mode, date: new Date().toISOString() });

  const key = progressKey();
  const total = getTotalCards();
  let idx = (state.userProgress[key] || 0) + 1;
  if (idx >= total) {
    idx = 0;
    showToast(state.mode === 'versets' ? "🎉 Pilier de versets terminé !" : "📢 Proclamations terminées !");
  }
  state.userProgress[key] = idx;
  saveState();
  render();
}

function peekPrev() {
  if(!TABS_DATA || TABS_DATA.length === 0) return;
  const key = progressKey();
  let idx = (state.userProgress[key] || 0) - 1;
  if (idx < 0) idx = 0;
  state.userProgress[key] = idx;
  saveState();
  render();
}

function peekNext() {
  if(!TABS_DATA || TABS_DATA.length === 0) return;
  const key = progressKey();
  const total = getTotalCards();
  let idx = (state.userProgress[key] || 0) + 1;
  if (idx >= total) idx = 0;
  state.userProgress[key] = idx;
  saveState();
  render();
}

// ÉVÉNEMENTS BOUTONS (A-, A+, Thème, Mode, Lecture)
function init() {
  loadState();
  
  // Font Size
  document.getElementById('fontIncBtn').addEventListener('click', () => {
    if(state.fontSize < 30) { state.fontSize += 2; saveState(); applyFontSize(); }
  });
  document.getElementById('fontDecBtn').addEventListener('click', () => {
    if(state.fontSize > 12) { state.fontSize -= 2; saveState(); applyFontSize(); }
  });

  // Theme
  document.getElementById('themeBtn').addEventListener('click', () => {
    state.theme = state.theme === 'dark' ? 'light' : 'dark';
    saveState();
    applyTheme();
  });

  // Toggles
  document.querySelectorAll('#modeToggle .toggle-btn').forEach(btn => {
    btn.addEventListener('click', () => { state.mode = btn.getAttribute('data-mode'); saveState(); render(); });
  });
  document.querySelectorAll('#versionToggle .toggle-btn').forEach(btn => {
    btn.addEventListener('click', () => { state.version = btn.getAttribute('data-version'); saveState(); render(); });
  });

  // Navigation actions
  document.getElementById('readBtn').addEventListener('click', markAsRead);
  document.getElementById('prevBtn').addEventListener('click', peekPrev);
  document.getElementById('nextBtn').addEventListener('click', peekNext);
  
  // Stats
  document.getElementById('statsBtn').addEventListener('click', showStats);

  // À propos & Partager (sidebar)
  document.getElementById('aboutBtn').addEventListener('click', () => { closeSidebar(); openAbout(); });
  document.getElementById('shareBtn').addEventListener('click', () => { closeSidebar(); shareApp(); });

  // Swipe support
  let touchStartX = 0;
  const mc = document.getElementById('mainContent');
  mc.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, {passive:true});
  mc.addEventListener('touchend', e => {
    const diff = e.changedTouches[0].screenX - touchStartX;
    if (Math.abs(diff) > 80) { if (diff < 0) markAsRead(); else peekPrev(); }
  }, {passive:true});

  // Premier rendu
  render();

  // Activation du module de mise à jour PWA
  registerSW();
}

// =====================================================
// MODULE DE MISE À JOUR (Service Worker) — Mode doux
// =====================================================
// Stratégie :
// 1. Le SW télécharge toute nouvelle version en arrière-plan (automatique).
// 2. Dès qu'elle est en 'waiting', un toast discret informe l'utilisateur.
// 3. L'activation est automatique :
//    - au prochain démarrage froid (si un SW attend déjà au chargement),
//    - OU après un long retour en premier plan (>60s d'absence).
// 4. Aucune lecture en cours n'est jamais interrompue.
// Le bandeau legacy reste disponible comme filet de sécurité manuel.

function registerSW() {
  if (!('serviceWorker' in navigator)) return;
  if (location.protocol !== 'http:' && location.protocol !== 'https:') return;

  let waitingWorker = null;
  let refreshing = false;
  let hiddenSince = 0;

  const banner = document.getElementById('updateBanner');
  const applyBtn = document.getElementById('updateApplyBtn');
  const laterBtn = document.getElementById('updateLaterBtn');

  function applyUpdate() {
    if (!waitingWorker) return;
    waitingWorker.postMessage('SKIP_WAITING');
    // Le reload effectif est déclenché par 'controllerchange' ci-dessous
  }

  function notifyUpdateReady(sw) {
    waitingWorker = sw;
    // Toast discret, ne bloque pas la lecture
    showToast('✨ Mise à jour prête — s\'appliquera au prochain lancement');
    // Le bandeau manuel reste disponible pour qui veut appliquer tout de suite
    if (banner) banner.classList.add('show');
  }

  if (applyBtn) applyBtn.addEventListener('click', () => {
    if (!waitingWorker) return;
    applyBtn.disabled = true;
    applyBtn.textContent = '…';
    applyUpdate();
  });
  if (laterBtn) laterBtn.addEventListener('click', () => {
    if (banner) banner.classList.remove('show');
  });

  // Reload UNE SEULE FOIS quand le nouveau SW prend le contrôle
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (refreshing) return;
    refreshing = true;
    window.location.reload();
  });

  navigator.serviceWorker.register('./sw.js').then(reg => {

    // --- COLD START : une MAJ attend déjà → on l'applique silencieusement ---
    if (reg.waiting && navigator.serviceWorker.controller) {
      waitingWorker = reg.waiting;
      applyUpdate(); // reload automatique via controllerchange
      return;
    }

    // --- Détection d'une nouvelle installation en cours de session ---
    reg.addEventListener('updatefound', () => {
      const newSW = reg.installing;
      if (!newSW) return;
      newSW.addEventListener('statechange', () => {
        if (newSW.state === 'installed' && navigator.serviceWorker.controller) {
          notifyUpdateReady(newSW);
        }
      });
    });

    // --- Vérifications périodiques des MAJ ---
    const checkForUpdate = () => {
      if (navigator.onLine) reg.update().catch(()=>{});
    };
    setInterval(checkForUpdate, 60 * 60 * 1000);
    window.addEventListener('online', checkForUpdate);

    // --- Auto-apply doux : après longue mise en arrière-plan ---
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') {
        hiddenSince = Date.now();
        return;
      }
      // Au retour en premier plan
      checkForUpdate();
      if (waitingWorker && hiddenSince && (Date.now() - hiddenSince) > 60000) {
        // L'utilisateur a laissé l'app en arrière-plan > 60s : on applique en douceur
        applyUpdate();
      }
      hiddenSince = 0;
    });

  }).catch(err => {
    console.warn('SW registration failed:', err);
  });
}

// TOAST ET MODAL STATS
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// =====================================================
// PARTAGE DE L'APPLICATION
// =====================================================
async function shareApp() {
  const shareData = {
    title: 'Mes Fondements en Christ',
    text: 'Médite chaque jour les fondements de ta vie en Christ — 7 piliers bibliques, hors-ligne, gratuit.',
    url: APP_PUBLIC_URL
  };

  // 1. Web Share API (mobile + certains desktops)
  if (navigator.share) {
    try {
      await navigator.share(shareData);
      return;
    } catch (err) {
      // L'utilisateur a annulé OU erreur réelle. Si annulation, on ne fait rien.
      if (err && err.name === 'AbortError') return;
      // Sinon on tombe sur le fallback
    }
  }

  // 2. Fallback : copier le lien dans le presse-papier
  try {
    await navigator.clipboard.writeText(APP_PUBLIC_URL);
    showToast('🔗 Lien copié — colle-le où tu veux');
    return;
  } catch (err) {
    // 3. Dernier recours : sélection manuelle
    const temp = document.createElement('input');
    temp.value = APP_PUBLIC_URL;
    document.body.appendChild(temp);
    temp.select();
    try {
      document.execCommand('copy');
      showToast('🔗 Lien copié');
    } catch {
      showToast(APP_PUBLIC_URL);
    }
    temp.remove();
  }
}

function showStats() {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>Statistiques</h3>
      <div class="modal-item"><span>Méditations lues</span><strong>${state.history.length} ✨</strong></div>
      <button class="modal-close" id="closeStatsBtn">Fermer</button>
      <button class="reset-link" id="resetBtn">Réinitialiser la progression</button>
    </div>
  `;
  document.body.appendChild(overlay);
  
  document.getElementById('closeStatsBtn').addEventListener('click', () => overlay.remove());
  document.getElementById('resetBtn').addEventListener('click', () => {
    if(confirm("Remettre à zéro la progression ?")) {
      state.history = []; state.userProgress = {};
      localStorage.removeItem('appProgress');
      saveState(); render(); overlay.remove(); showToast("Réinitialisé !");
    }
  });
}
